spring:
  application:
    name: review-service

  flyway:
    ignore-migration-patterns: "*:Missing"

datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/prpilot}
    username: ${SPRING_DATASOURCE_USERNAME:prpilot}
    password: ${SPRING_DATASOURCE_PASSWORD:prpilot_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: review-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: dev.prpilot.review.model.PullRequestEvent

server:
  port: 8083

prpilot:
  kafka:
    topics:
      pr-events: pr.events
      reviews-completed: reviews.completed
  retrieval:
    top-k: 8
  voyage:
    api-key: ${VOYAGE_API_KEY}
    api-url: https://api.voyageai.com/v1/embeddings
    model: voyage-code-2
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
    api-url: https://api.anthropic.com/v1/messages
    model: claude-haiku-4-5
    max-tokens: 2048
  github:
    token: ${GITHUB_TOKEN_PRPILOT:}
    api-url: https://api.github.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    dev.prpilot: DEBUG